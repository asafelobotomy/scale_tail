name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Clippy, tests and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories

  uq-widget:
    name: uQ integration (widget, page, check)
    runs-on: ubuntu-24.04
    env:
      UQ_TAG: v0.3.0-rc.1   # the uQ release whose `uqctl` and settings page test kit this repo follows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Qt Quick and qmltestrunner
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools \
            qml6-module-qtquick qml6-module-qtquick-layouts qml6-module-qtquick-controls \
            qml6-module-qttest qml6-module-qtqml-workerscript \
            qml6-module-qtquick-window qml6-module-qtquick-templates
      - name: Page logic and manifest tests (Node)
        run: node --test tests/uq/*.test.mjs
      - name: Widget and page tests (QML)
        run: QT_QPA_PLATFORM=offscreen /usr/lib/qt6/bin/qmltestrunner -import tests/uq/stub -input tests/uq
      # The PKGBUILD installs every file of each uq/pages/<id>/ folder: run its own function into a
      # temporary root and compare with the folder.
      - name: Packaging installs the whole page folder
        run: |
          root=$(mktemp -d)
          eval "$(sed -n '/^_install_uq_folders()/,/^}/p' packaging/aur/PKGBUILD)"
          _install_uq_folders uq/pages "$root/usr/share/uq/settings/pages"
          diff <(ls uq/pages/scale-tail) <(ls "$root/usr/share/uq/settings/pages/scale-tail")
          test "$(ls "$root/usr/share/uq/settings/pages" | wc -l)" = 1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Cache uqctl
        id: uqctl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.uq
          key: uqctl-${{ env.UQ_TAG }}
      - name: Build uqctl
        if: steps.uqctl.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/asafelobotomy/uq --tag "$UQ_TAG" uqctl --root "$HOME/.uq"
      # `--no-programs` skips only the "program exists" check: scale_tail and tailscale aren't
      # installed here. Paths and everything else are still checked.
      - name: uQ integration check
        run: ~/.uq/bin/uqctl integrations check --no-programs uq/

  appimage:
    runs-on: ubuntu-22.04   # older glibc => wider AppImage compatibility
    permissions:
      contents: write   # attaches the AppImage to tagged releases
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install appstream (metadata validation)
        run: sudo apt-get update && sudo apt-get install -y appstream zsync
      - name: Install appimagetool
        run: |
          curl -fL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/appimagetool
      - name: Build AppImage
        run: ./packaging/build-appimage.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scale_tail-appimage
          path: |
            scale_tail-*.AppImage
            scale_tail-*.AppImage.zsync
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            scale_tail-*.AppImage
            scale_tail-*.AppImage.zsync
